# Starts the app from a clean install state, as a guest.
#
# METRO_URL (optional): set it to run on a development build, which loads its
# JavaScript from Metro. Android emulator: http://10.0.2.2:8081. Phone: the
# PC's address on the Wi-Fi, e.g. http://192.168.1.20:8081. Leave it out for an
# e2e-test build, which embeds its JavaScript.
appId: com.alexandrerichert.scannbook
env:
  METRO_URL: ${METRO_URL || ""}
---
- launchApp:
    clearState: true
# The dev client opens on its launcher: point it at Metro, without the dev
# menu onboarding, the menu at launch or the tools button over the app.
- runFlow:
    when:
      true: ${METRO_URL != ""}
    commands:
      - openLink: exp+scannbook://expo-development-client/?url=${encodeURIComponent(METRO_URL)}&disableOnboarding=1&disableAutoLaunch=1&disableFab=1
# A clean install always starts with the app's own onboarding.
- extendedWaitUntil:
    visible:
      id: onboarding-skip
    timeout: 120000
- tapOn:
    id: onboarding-skip
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 10000
